  - "https://raw.githubusercontent.com/cbusifabcap/daily_free_vpn/main/sub/V2Ray.yml"
  - "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.txt"
  - "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/airport_merge_base64.txt"
# These three repositories publish result pools. Their subscription files are
# discovered from the Git tree and README links, so rotating feed URLs can be
# followed automatically without editing this file.
result_pool_repositories:
  - repo: cbusifabcap/daily_free_vpn
    max_files: 20
  - repo: toshare5/toshare5.github.io
    max_files: 20
  - repo: mkshare3/mkshare3.github.io
    max_files: 20

# Source repositories are also crawled for generated subscriptions and node lists.
source_code_repositories:
  - repo: peasoft/NoMoreWalls
    max_files: 20
  - repo: mahdibland/V2RayAggregator
    max_files: 20
  - repo: clashv2rayc/clashv2rayc.github.io
    max_files: 20

# Import OgdenThomas/freesub's generated result pool last, then merge it with
# the sources above. Do not add this repository to either crawler list.
final_result_pools:
  - "https://raw.githubusercontent.com/OgdenThomas/freesub/main/output/v2ray.txt"
