  - "https://open.heleimail.workers.dev/"
  - "https://raw.githubusercontent.com/roosterkid/openproxylist/main/V2RAY.txt"
  - "https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/top100.txt"
